<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Diary</title>
<meta name="description" content="A photo diary: add photos and write an entry for each day, then browse by calendar.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📔</text></svg>">
</head>
<body>
<header class="topbar">
  <h1>📔 Photo Diary</h1>
  <div class="topbar-actions">
    <button id="exportBtn" type="button" title="Download all entries and photos as one backup file">Export backup</button>
    <label class="import-label" title="Restore from a backup file exported earlier">
      Import backup
      <input id="importInput" type="file" accept="application/json" hidden>
    </label>
  </div>
</header>

<main>
  <section class="calendar-card" aria-label="Calendar">
    <div class="calendar-head">
      <button id="prevMonth" type="button" aria-label="Previous month">←</button>
      <h2 id="monthLabel"></h2>
      <button id="nextMonth" type="button" aria-label="Next month">→</button>
      <button id="todayBtn" type="button">Today</button>
    </div>
    <div class="weekdays" aria-hidden="true">
      <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>
    <div id="calendar" class="calendar-grid"></div>
    <p class="legend"><span class="dot"></span> has writing &nbsp;·&nbsp; thumbnail = first photo of the day</p>
  </section>

  <section class="day-card" aria-label="Day entry">
    <h2 id="dayLabel"></h2>

    <div class="photos-head">
      <h3>Photos</h3>
      <label class="add-photos">
        + Add photos
        <input id="photoInput" type="file" accept="image/*" multiple hidden>
      </label>
    </div>
    <p id="noPhotos" class="muted">No photos for this day yet.</p>
    <div id="photoGrid" class="photo-grid"></div>

    <h3 class="writing-head">Writing</h3>
    <textarea id="entryText" rows="8" placeholder="Dear diary…"></textarea>
    <div class="save-row">
      <button id="saveBtn" type="button">Save writing</button>
      <span id="saveStatus" class="save-status" role="status"></span>
    </div>
  </section>
</main>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightboxClose" type="button" aria-label="Close">×</button>
  <img id="lightboxImg" alt="Photo, full size">
</div>

<script src="app.js"></script>
</body>
</html>
